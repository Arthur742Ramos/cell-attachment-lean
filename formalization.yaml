version: "v0.4"
project:
  name: "Fundamental Groups of Arbitrary Two-Cell Attachments"
  description: >-
    The full arbitrary-family two-cell attachment theorem for ordinary topological
    fundamental groups. For any path-connected topological space X, any basepoint,
    and any indexed family of continuous circle attaching maps, a genuine adjunction
    quotient is constructed from X and the coproduct of closed complex unit disks.
    The actual inclusion-induced fundamental-group homomorphism is surjective and
    its kernel is precisely the normal closure of the once-around attaching loops,
    transported along the specified basepoint paths. A quotient group isomorphism
    is proved compatible with the actual inclusion map. No finiteness, CW,
    separation, local-connectivity or semilocal-simple-connectivity hypotheses are added.
  authors: ["Arthur Freitas Ramos", "David Barros Hulak", "Ruy Jose Guerra Barretto de Queiroz"]
  responsible_maintainers: ["Arthur Freitas Ramos"]
  license: "Apache-2.0"
classification:
  arxiv: ["math.AT", "math.CT"]
  msc2020: ["55Q05", "18B40"]
